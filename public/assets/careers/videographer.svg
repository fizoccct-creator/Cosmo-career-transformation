<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <!-- PLACEHOLDER scene for the template portrait: replace with a Figma export (1080x1350). Keep the lower-middle clear for the person. -->
  <defs>
    <radialGradient id="g" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#36449a"/><stop offset=".55" stop-color="#202959"/><stop offset="1" stop-color="#121735"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FDD00D" stop-opacity=".35"/><stop offset="1" stop-color="#FDD00D" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="36" height="36" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#ffffff" opacity=".07"/></pattern>
  </defs>
  <rect width="1080" height="1350" fill="url(#g)"/>
  <rect width="1080" height="1350" fill="url(#dots)"/>
  <ellipse cx="540" cy="560" rx="470" ry="470" fill="url(#glow)"/>
  <circle cx="540" cy="560" r="400" fill="none" stroke="#FDD00D" stroke-opacity=".35" stroke-width="6" stroke-dasharray="4 22" stroke-linecap="round"/>
  <g fill="none" stroke="#FDD00D" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <!-- LED panel left -->
    <rect x="70" y="120" width="200" height="140" rx="14"/><path d="M110 160 H230 M110 200 H230"/><path d="M170 260 V560 M120 560 H220"/>
    <!-- clapperboard right -->
    <g transform="translate(820 130)"><rect x="0" y="50" width="190" height="130" rx="10"/><path d="M0 50 L180 0"/><path d="M40 40 L60 2 M100 22 L120 -14"/></g>
    <!-- play badge -->
    <g transform="translate(480 60)"><rect x="0" y="0" width="120" height="120" rx="26"/><path d="M45 35 L85 60 L45 85 Z"/></g>
  </g>
  <rect y="1150" width="1080" height="200" fill="#121735" opacity=".55"/>
</svg>